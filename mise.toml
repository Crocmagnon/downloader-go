[tasks.build]
description = "Build downloader binaries into dist/"
run = [
    "mkdir -p dist",
    "go build -o ./dist/downloader ."
]
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["dist/downloader"]

[tasks.lint]
description = "Run golangci-lint with fixes"
run = "golangci-lint run --fix ./..."
sources = ["**/*.go", "go.mod", "go.sum"]

[tasks.test]
description = "Run unit tests"
run = "go test ./..."
sources = ["**/*.go", "go.mod", "go.sum"]

[tasks.deploy]
description = "Deploy downloader to vps-2"
depends = ["build"]
run = "scp ./dist/downloader vps-2:deploy/paperless-ngx/downloader"

[tasks.all]
description = "Run tests, lint, then build"
depends = ["test", "lint", "build"]

[tasks.default]
description = "Default task: run tests, lint, and build"
depends = ["all"]
